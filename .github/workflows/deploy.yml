# Builds the app and publishes it to GitHub Pages.
#
# This is what makes the app installable without owning a computer: the build
# runs on GitHub's machines, and the owner starts it from the GitHub website on
# their phone (Actions -> Deploy to GitHub Pages -> Run workflow).
#
# It also runs on every push to the feature branch, so a change made anywhere
# reaches the phone without anyone starting anything.

name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/iphone-investment-app-frn8sy
  workflow_dispatch:
  # Marks go stale on their own, so something has to run when nobody is
  # looking. Through the US session (13:30-20:00 UTC, with a margin either side
  # for daylight saving), weekdays only — outside those hours the prices have
  # not moved and the run would be noise.
  #
  # Every 30 minutes rather than every 15: the sweep is 537 symbols paced just
  # under Finnhub's sixty-a-minute allowance, which takes about ten minutes, and
  # the build adds another two. A quarter-hourly schedule would have runs
  # overlapping each other. Coverage is worth more than freshness here — a
  # portfolio is not traded on the half hour — and GitHub delays scheduled runs
  # under load anyway, which is why the app shows the age of a mark rather than
  # implying it is live.
  schedule:
    - cron: '5,35 13-21 * * 1-5'

# Pages needs these; the defaults are not enough.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer deploy should win, but never kill one that is already uploading.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # If these fail the site is not published. A broken build reaching the
      # phone is worse than an old one staying there.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Fetched here rather than in the app so the key never ships. The phone
      # reads the result from its own origin, holds no secret, and does not
      # have to be open for the numbers to be current.
      #
      # continue-on-error: a bad minute at Finnhub should not stop a deploy.
      # The script already refuses to overwrite good marks with an empty file,
      # so the worst case is the site republishes with the previous quotes.json
      # and the app says how old it is.
      - name: Fetch live marks
        continue-on-error: true
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: node scripts/fetch-quotes.mjs public

      - name: Build the web app
        env:
          # GitHub Pages serves a project site under /<repo>/, so every asset
          # path needs that prefix baked in.
          EXPO_PUBLIC_BASE_URL: ${{ github.event.repository.name }}
        run: npx expo export --platform web --output-dir dist --clear

      # Adds the head tags that make Safari install this as an app rather
      # than bookmark it, plus the 404 fallback Pages needs for deep links and
      # the .nojekyll that stops Pages eating the _expo directory. Exits
      # non-zero if any of it fails to apply.
      - name: Apply the PWA shell
        env:
          EXPO_PUBLIC_BASE_URL: ${{ github.event.repository.name }}
        run: node scripts/pwa-shell.mjs dist

      # The bundle is what the public actually sees. Fail the build rather than
      # publish credentials or owner-specific data by accident.
      - name: Check nothing personal is in the build
        run: node scripts/privacy-check.mjs dist

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Without this, a repository that has never had Pages switched on fails
      # with a 404 and an octokit stack trace, which tells the owner nothing.
      # The build has already succeeded by this point, so the only thing left
      # to get wrong is the setting — say so in words.
      - name: Check Pages is switched on
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          if [ "$status" = "404" ]; then
            echo "::error title=GitHub Pages is not enabled::The app built fine — only publishing is blocked."
            echo ""
            echo "Fix it once, from a phone or a computer:"
            echo "  1. Open https://github.com/${{ github.repository }}/settings/pages"
            echo "  2. Under 'Build and deployment', set Source to 'GitHub Actions'"
            echo "  3. Re-run this workflow"
            echo ""
            echo "If that page says Pages is unavailable, the repository is private on a"
            echo "free plan. Pages needs either a public repository (free) or GitHub Pro."
            echo "Note that a Pages site is publicly reachable either way — paying does"
            echo "not make the published app private."
            exit 1
          fi
          echo "Pages is enabled (HTTP $status). Publishing."

      - id: deployment
        uses: actions/deploy-pages@v4
